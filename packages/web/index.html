<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SubTrack — track every subscription, see what you actually spend, and let AI find the waste." />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <title>SubTrack — AI subscription manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 20.5c1.8 1.6 4.1 2.5 6.6 2.5 3.6 0 6.4-1.7 6.4-4.4 0-2.6-2-3.8-5.6-4.6-3-.7-4-1.2-4-2.3 0-1.2 1.3-2 3.3-2 1.9 0 3.6.6 5 1.7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so a dark-mode user never sees a white
      // flash while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('subtrack.theme');
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
